<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>INCK Forms</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f4f5f8;--card:#fff;--ink:#1a1f2e;--muted:#667085;--line:#d6dae3;--accent:#1f4fbf;--err:#c4312b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11141b;--card:#1a1f2a;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2e3545;--accent:#6f9bff;--err:#ff7a70}}
:root[data-theme="dark"]{--bg:#11141b;--card:#1a1f2a;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2e3545;--accent:#6f9bff;--err:#ff7a70}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans','Noto Sans Devanagari',system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:6px 0 2px}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 12px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}
label .req{color:var(--err)}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font:inherit;font-size:15px}
textarea{min-height:64px;resize:vertical}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid .full{grid-column:1/-1}
@media (max-width:520px){.grid{grid-template-columns:1fr}}
.err{color:var(--err);font-size:12px;margin-top:4px}
.sigbox{border:1.5px dashed var(--line);border-radius:10px;background:#fff;position:relative}
.sigbox canvas{display:block;width:100%;height:160px;touch-action:none}
.sigbox .hint{position:absolute;left:12px;bottom:8px;color:#99a;font-size:12px;pointer-events:none}
.row-btn{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.btn{border:0;background:var(--accent);color:#fff;padding:11px 16px;border-radius:10px;font:inherit;font-weight:600;font-size:15px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.wa{background:#1fa855}
.btn:disabled{opacity:.55}
.ph{display:flex;gap:12px;align-items:center}
.ph .thumb{width:72px;height:90px;border:1px dashed var(--line);border-radius:8px;background:center/cover no-repeat}
.pv{width:100%;overflow:hidden;margin-top:10px}
#doc{transform-origin:top left}
/* overlay pieces on the form image */
.ov{position:absolute;overflow:hidden;color:#0d1640;font-family:'Noto Sans','Noto Sans Devanagari',sans-serif;font-weight:600}
.ov.tx{white-space:nowrap}
.ov.ml{white-space:normal;line-height:1.2;word-break:break-word}
.ov.pic{background-repeat:no-repeat;background-position:center bottom}
</style>
</head>
<body>
<div class="wrap">
  <h1>INCK Forms</h1>
  <p class="sub">Choose the form, fill your details, add photo and signature, then share the PDF on WhatsApp.</p>

  <div class="card">
    <label style="margin-top:0">Form type</label>
    <div class="chips" id="chips"></div>
  </div>

  <div class="card">
    <div class="grid" id="fields"></div>
    <div class="row-btn" style="margin-top:16px"><button class="btn" id="genBtn">Generate form</button></div>
    <div class="err" id="formErr"></div>
  </div>

  <div class="card" id="outCard" hidden>
    <div class="row-btn" style="margin-top:0">
      <button class="btn wa" id="waBtn" disabled>Preparing PDF…</button>
      <button class="btn ghost" id="pdfBtn">Download PDF</button>
    </div>
    <div class="pv" id="pv"></div>
  </div>
</div>

const data={};
let current='membership';

/* ---------- Build the filled page ---------- */
function renderDoc(f,d){
  const [cx,cy,cw,ch]=f.crop||[0,0,f.W,f.H];
  let h=`<div id="doc" style="position:relative;width:${cw}px;height:${ch}px;overflow:hidden;background:#fff">
    <img src="${f.img}" alt="" style="position:absolute;left:${-cx}px;top:${-cy}px;width:${f.W}px;height:${f.H}px;max-width:none">`;
  for(const o of f.ov){
    const v=o.v(d);if(!v)continue;
    const st=`left:${o.x-cx}px;top:${o.y-cy}px;width:${o.w}px;height:${o.h}px`;
    const fs=o.fs||f.fs;
    if(o.t==='cover')h+=`<div class="ov" style="${st};background:${o.bg}"></div>`;
    else if(o.t==='img')h+=`<div class="ov pic" style="${st};background-image:url('${v}');background-size:${o.fit}"></div>`;
    else if(o.t==='tick')h+=`<div class="ov" style="${st};font-size:${o.h}px;line-height:${o.h}px;text-align:center;font-family:'DejaVu Sans',sans-serif">✓</div>`;
    else if(o.t==='multi')h+=`<div class="ov ml" style="${st};font-size:${fs}px${o.lh?`;line-height:${o.lh}px`:''}">${esc(v)}</div>`;
    else h+=`<div class="ov tx" style="${st};font-size:${fs}px;line-height:${o.h}px;text-align:${o.al||'left'};letter-spacing:${o.ls||0}px${o.ul?';border-bottom:1.5px solid #333':''}">${esc(v)}</div>`;
  }
  return h+'</div>';
}
function fitText(){
  document.querySelectorAll('#doc .tx').forEach(el=>{let s=parseFloat(el.style.fontSize);while(el.scrollWidth>el.clientWidth&&s>7){s-=0.5;el.style.fontSize=s+'px';}});
  document.querySelectorAll('#doc .ml').forEach(el=>{let s=parseFloat(el.style.fontSize);while(el.scrollHeight>el.clientHeight&&s>6){s-=0.5;el.style.fontSize=s+'px';}});
}

/* ---------- Image helpers ---------- */
async function loadImg(file){
  // createImageBitmap handles big phone photos and rotation; fall back to <img> for older browsers
  if(window.createImageBitmap){try{return await createImageBitmap(file,{imageOrientation:'from-image'});}catch(e){}}
  return await new Promise((res,rej)=>{const url=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{res(im);setTimeout(()=>URL.revokeObjectURL(url),1000);};im.onerror=()=>rej(new Error('unreadable'));im.src=url;});
}
async function shrink(file,max=700){
  const im=await loadImg(file),W=im.width,H=im.height;
  const s=Math.min(1,max/Math.max(W,H)),c=document.createElement('canvas');c.width=Math.round(W*s);c.height=Math.round(H*s);
  const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(im,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',0.88);
}

function trimCanvas(cv){
  const ctx=cv.getContext('2d'),{width:w,height:h}=cv,px=ctx.getImageData(0,0,w,h).data;
  let x0=w,y0=h,x1=-1,y1=-1;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(px[(y*w+x)*4+3]>0){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
  if(x1<0)return null;
  const pad=4,c=document.createElement('canvas');x0=Math.max(0,x0-pad);y0=Math.max(0,y0-pad);x1=Math.min(w-1,x1+pad);y1=Math.min(h-1,y1+pad);
  c.width=x1-x0+1;c.height=y1-y0+1;c.getContext('2d').drawImage(cv,x0,y0,c.width,c.height,0,0,c.width,c.height);return c.toDataURL('image/png');
}

function initSig(cv){
  const ctx=cv.getContext('2d'),r=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
  cv.width=w*r;cv.height=h*r;ctx.scale(r,r);ctx.lineWidth=2.6;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#0b1f66';
  let drawing=false,last=null,dirty=false;const hint=cv.parentNode.querySelector('.hint');
  const pos=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
  cv.addEventListener('pointerdown',e=>{drawing=true;last=pos(e);cv.setPointerCapture(e.pointerId);e.preventDefault();hint.style.display='none'});
  cv.addEventListener('pointermove',e=>{if(!drawing)return;const p=pos(e);ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();last=p;dirty=true});
  const end=()=>{if(!drawing)return;drawing=false;if(dirty)data.signature=trimCanvas(cv)};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  return ()=>{ctx.clearRect(0,0,w,h);data.signature=null;dirty=false;hint.style.display='';hint.textContent='Sign here with finger or mouse'};
}

/* ---------- UI ---------- */
function renderChips(){
  $('#chips').innerHTML=Object.entries(FORMS).map(([k,f])=>`<button class="chip ${k===current?'on':''}" data-k="${k}">${f.title}</button>`).join('');
  $('#chips').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{current=b.dataset.k;renderChips();renderFields();$('#outCard').hidden=true;});
}
function renderFields(){
  $('#fields').innerHTML=FORMS[current].fields.map(k=>{const f=FIELDS[k],lab=`<label for="f_${k}">${f.label}${f.req?' <span class="req">*</span>':''}</label>`;
    let ctl;
    if(f.type==='textarea')ctl=`<textarea id="f_${k}" data-k="${k}">${esc(data[k])}</textarea>`;
    else if(f.type==='select')ctl=`<select id="f_${k}" data-k="${k}"><option value="">Select</option>${f.options.map(o=>`<option ${data[k]===o?'selected':''}>${o}</option>`).join('')}</select>`;
    else if(f.type==='photo')ctl=`<div class="ph"><div class="thumb" id="thumb" style="${data.photo?`background-image:url('${data.photo}')`:''}"></div><div style="flex:1"><div class="row-btn" style="margin-top:0">
      <label class="btn ghost" style="margin:0;display:inline-block">📷 Camera<input type="file" accept="image/*" capture="user" class="f_photo" hidden></label>
      <label class="btn ghost" style="margin:0;display:inline-block">🖼️ Gallery<input type="file" accept="image/*" class="f_photo" hidden></label>
      </div><div style="font-size:12px;color:var(--muted);margin-top:6px" id="phMsg">${data.photo?'Photo added ✓':'Take a photo or pick one from your gallery'}</div></div></div>`;
    else if(f.type==='signature')ctl=`<div class="sigbox"><canvas id="sigCv"></canvas><span class="hint">${data.signature?'Signature saved — draw again to replace':'Sign here with finger or mouse'}</span></div><div class="row-btn"><button class="btn ghost" type="button" id="sigClear">Clear signature</button></div>`;
    else ctl=`<input id="f_${k}" data-k="${k}" type="${f.type}" ${f.mode?`inputmode="${f.mode}"`:''} value="${esc(data[k])}">`;
    return `<div class="${f.full?'full':''}">${lab}${ctl}<div class="err" id="e_${k}"></div></div>`;}).join('');
  $('#fields').querySelectorAll('[data-k]').forEach(el=>el.oninput=el.onchange=()=>data[el.dataset.k]=el.value.trim());
  document.querySelectorAll('.f_photo').forEach(inp=>inp.onchange=async e=>{
    const f=e.target.files[0],msg=$('#phMsg');if(!f)return;
    msg.style.color='';msg.textContent='Loading photo…';
    try{data.photo=await shrink(f);$('#thumb').style.backgroundImage=`url('${data.photo}')`;msg.textContent='Photo added ✓';}
    catch(err){msg.style.color='var(--err)';msg.textContent='This photo could not be read. Try another photo, or take a screenshot of it and upload that.';}
    e.target.value='';
  });
  const cv=$('#sigCv');if(cv){const clear=initSig(cv);$('#sigClear').onclick=clear;}
}
function validate(){
  let ok=true;
  for(const k of FORMS[current].fields){const f=FIELDS[k],v=data[k],e=$('#e_'+k);e.textContent='';
    if(f.req&&!v){e.textContent='Required';ok=false;continue;}
    if(v&&f.re&&!f.re.test(v)){e.textContent=f.msg;ok=false;}}
  $('#formErr').textContent=ok?'':'Please fix the highlighted fields.';
  return ok;
}
function fitPreview(){
  const el=$('#doc'),pv=$('#pv');if(!el)return;el.style.transform='none';
  const s=Math.min(1,pv.clientWidth/el.offsetWidth);el.style.transform=`scale(${s})`;pv.style.height=el.offsetHeight*s+'px';
}

/* ---------- PDF + WhatsApp ---------- */
let cachedPdf=null;
const fileBase=()=>`${FORMS[current].title.replace(/\s+/g,'_')}_${(data.name||'applicant').replace(/[^\wऀ-ॿ]+/g,'_')}`;
async function buildPdf(){
  const c=await html2canvas($('#doc'),{scale:2,backgroundColor:'#ffffff',onclone:d=>{d.getElementById('doc').style.transform='none';const pv=d.getElementById('pv');pv.style.overflow='visible';pv.style.height='auto';d.querySelector('.wrap').style.maxWidth='none'}});
  const img=c.toDataURL('image/jpeg',0.88),{jsPDF}=window.jspdf;
  const isCard=current==='idcard',w=isCard?54:210,h=w*c.height/c.width;
  const pdf=new jsPDF({unit:'mm',format:[w,h],orientation:h>w?'portrait':'landscape'});
  pdf.addImage(img,'JPEG',0,0,w,h);
  return {pdf,file:new File([pdf.output('blob')],fileBase()+'.pdf',{type:'application/pdf'})};
}
async function prepare(){
  const wa=$('#waBtn');cachedPdf=null;wa.disabled=true;wa.textContent='Preparing PDF…';
  try{cachedPdf=await buildPdf();wa.disabled=false;wa.textContent='Share on WhatsApp';}
  catch(e){wa.textContent='PDF failed — use Download';console.error(e);}
}
$('#genBtn').onclick=async()=>{
  if(!validate())return;
  $('#pv').innerHTML=renderDoc(FORMS[current],data);
  $('#outCard').hidden=false;
  if(document.fonts)await document.fonts.ready;
  await new Promise(r=>{const im=$('#doc img');im.complete?r():im.onload=r;});
  fitText();fitPreview();$('#outCard').scrollIntoView({behavior:'smooth'});
  prepare();
};
window.addEventListener('resize',fitPreview);
$('#pdfBtn').onclick=async()=>{try{(cachedPdf||await buildPdf()).pdf.save(fileBase()+'.pdf');}catch(e){alert('Could not create PDF: '+e.message);}};
$('#waBtn').onclick=async()=>{
  if(!cachedPdf)return;
  const msg=`${FORMS[current].title} form – ${data.name||''}${data.mobile?' ('+data.mobile+')':''}`,file=cachedPdf.file;
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:msg,text:msg});return;}catch(e){if(e.name==='AbortError')return;}
  }
  cachedPdf.pdf.save(file.name);
  setTimeout(()=>window.open(`https://wa.me/${WHATSAPP.replace(/\D/g,'')}?text=${encodeURIComponent(msg+' — PDF attached')}`,'_blank'),600);
  alert('PDF downloaded. WhatsApp will open — attach the downloaded PDF and send.');
};

renderChips();renderFields();
// load the form images in the background so Generate is instant
Object.values(FORMS).forEach(f=>{new Image().src=f.img;});
</script>
